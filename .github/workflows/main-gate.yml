name: Main Gate

# main 推送触发；产出 SBOM (CycloneDX) + tarball + GateReport.json，
# artifact 保留 90 天，用于审计 / 回溯。
# 不阻塞 PR——PR 由 ci.yml 守门。

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  main-gate:
    name: Main Branch Gate (SBOM + Tarball)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        id: typecheck
        run: bun run typecheck

      - name: Test
        id: test
        run: bun test

      - name: Build
        id: build
        run: bun run build

      - name: Release Check (strict — mirrored docs required)
        id: release-check-strict
        # 在 main gate 上执行严格模式：要求 README/CHANGELOG 等已镜像到各发布包。
        run: |
          bash scripts/publish.sh --dry-run || true
          bun run release:check:strict

      - name: Generate SBOM (CycloneDX)
        id: sbom
        run: |
          mkdir -p artifacts
          bunx @cyclonedx/cyclonedx-npm@latest \
            --spec-version 1.6 \
            --output-format JSON \
            --output-file artifacts/sbom.cdx.json
          bunx @cyclonedx/cyclonedx-cli@latest validate \
            --input-file artifacts/sbom.cdx.json \
            --input-format json \
            --input-version v1_6 \
            --fail-on-errors

      - name: Pack Tarballs
        id: pack
        run: |
          mkdir -p artifacts/tarballs
          for pkg in packages/cli packages/core packages/extensions packages/host-defaults; do
            if [ -f "$pkg/package.json" ]; then
              (cd "$pkg" && bun pm pack --destination ../../artifacts/tarballs) || echo "pack failed: $pkg"
            fi
          done
          ls -la artifacts/tarballs

      - name: Build Gate Report
        if: always()
        run: |
          bun scripts/build-gate-report.ts \
            --out=artifacts/gate-report.json \
            --gate=typecheck:${{ steps.typecheck.outcome == 'success' && 'pass' || 'fail' }}:0:main-gate \
            --gate=test:${{ steps.test.outcome == 'success' && 'pass' || 'fail' }}:0:main-gate \
            --gate=build:${{ steps.build.outcome == 'success' && 'pass' || 'fail' }}:0:main-gate \
            --gate=release-check-strict:${{ steps.release-check-strict.outcome == 'success' && 'pass' || 'fail' }}:0:strict-mirrored-docs \
            --gate=sbom:${{ steps.sbom.outcome == 'success' && 'pass' || 'fail' }}:0:cyclonedx-json-validated \
            --gate=pack:${{ steps.pack.outcome == 'success' && 'pass' || 'fail' }}:0:bun-pm-pack

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-gate-${{ github.run_id }}
          path: artifacts/
          retention-days: 90
