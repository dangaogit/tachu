name: Release Publish

# tag (v*) 触发；生成 OIDC provenance (actions/attest-build-provenance)
# 并以 `npm publish --provenance` 发布。
# 前置：scripts/publish.sh 镜像 docs；release:check:strict 强制 mirrored docs。
#
# 前置条件（一次性配置）：
#   • Repo Settings → Actions → General → Workflow permissions: enable id-token write
#   • Org/repo allow `actions/attest-build-provenance@v1`
#   • NPM_TOKEN secret 配置为 npm automation token

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (skip npm publish)"
        type: boolean
        default: true

permissions:
  contents: write   # tag annotations
  id-token: write   # OIDC for provenance
  attestations: write

jobs:
  publish:
    name: Build, Sign, Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node (for npm publish --provenance)
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        id: typecheck
        run: bun run typecheck

      - name: Test
        id: test
        run: bun test

      - name: Build
        id: build
        run: bun run build

      - name: Mirror docs into packages
        id: mirror
        # publish.sh 把 README/README_ZH/LICENSE/CHANGELOG 复制到每个 public package。
        # 我们直接调用其内部的 mirror 段：先 dry-run 触发 mirror，再单独走 release:check:strict。
        run: |
          # 复用 publish.sh --dry-run 触发其内部 mirror 段（把 README/CHANGELOG 等镜像到各包）。
          # dry-run 末段退出码可能非零，但 mirror 已发生；用 || true 兜底。
          bash scripts/publish.sh --dry-run 2>&1 | tee /tmp/publish-dry.log || true

      - name: Release Check (strict — mirrored docs required)
        id: release-check-strict
        run: bun run release:check:strict

      - name: Pack Tarballs
        id: pack
        run: |
          mkdir -p artifacts/tarballs
          for pkg in packages/cli packages/core packages/extensions packages/host-defaults; do
            if [ -f "$pkg/package.json" ]; then
              (cd "$pkg" && npm pack --json --pack-destination ../../artifacts/tarballs) | tee -a artifacts/pack.log
            fi
          done
          ls -la artifacts/tarballs

      - name: Attest Build Provenance
        id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "artifacts/tarballs/*.tgz"

      - name: npm Publish (provenance)
        id: npm-publish
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for tgz in artifacts/tarballs/*.tgz; do
            echo "Publishing $tgz"
            npm publish "$tgz" --provenance --access public
          done

      - name: Build Gate Report
        if: always()
        run: |
          bun scripts/build-gate-report.ts \
            --out=artifacts/gate-report.json \
            --gate=typecheck:${{ steps.typecheck.outcome == 'success' && 'pass' || 'fail' }}:0:release \
            --gate=test:${{ steps.test.outcome == 'success' && 'pass' || 'fail' }}:0:release \
            --gate=build:${{ steps.build.outcome == 'success' && 'pass' || 'fail' }}:0:release \
            --gate=mirror:${{ steps.mirror.outcome == 'success' && 'pass' || 'fail' }}:0:publish-sh-dry-run \
            --gate=release-check-strict:${{ steps.release-check-strict.outcome == 'success' && 'pass' || 'fail' }}:0:strict \
            --gate=pack:${{ steps.pack.outcome == 'success' && 'pass' || 'fail' }}:0:npm-pack \
            --gate=attest:${{ steps.attest.outcome == 'success' && 'pass' || 'fail' }}:0:actions-attest-build-provenance \
            --gate=npm-publish:${{ steps.npm-publish.outcome == 'success' && 'pass' || (steps.npm-publish.outcome == 'skipped' && 'skipped' || 'fail') }}:0:npm-provenance

      - name: Upload Release Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.ref_name }}-${{ github.run_id }}
          path: artifacts/
          retention-days: 365
